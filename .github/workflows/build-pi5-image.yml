name: Build Pi 5 Docker Image

# Builds an arm64 (Raspberry Pi 5 / Cortex-A76) Docker image from the existing
# Dockerfile and publishes it to GHCR. Run this on your Pi 5 via docker-compose
# (see docs/pi5-deploy/README.md for the compose + Watchtower auto-update setup)
# rather than flashing a custom OS image — this repo already ships as a
# container, and the Dockerfile already handles TARGETPLATFORM=linux/arm64.

on:
  push:
    branches:
      - feat-readarr
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pi5-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-building arm64 on an x86 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=pi5-latest
            type=raw,value=pi5-${{ github.ref_name }}
            type=sha,prefix=pi5-,format=short

      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
