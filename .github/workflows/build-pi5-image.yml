name: Build Pi 5 Docker Image

# Builds an arm64 (Raspberry Pi 5 / Cortex-A76) Docker image natively on a
# GitHub arm64 runner and publishes it to GHCR. Normally builds jabloink/seerr
# feat-readarr (the book/Readarr branch) directly and tags it pi5-latest, so
# picking up upstream work never needs a rebase of this fork. watch-upstream
# starts this build automatically when that branch moves.
#
# The source_repo/source_ref inputs let you build from a DIFFERENT repo/ref
# instead (e.g. jabloink/seerr at tag v3.2.0, as a migration bridge when a
# newer build's database schema guard refuses to auto-upgrade from an older
# one). Bridge builds never touch pi5-latest.
#
# Deploying is manual: Gantry excludes seerr_fork, so back up the DB and
# update the service yourself once a build is green.

on:
  push:
    branches:
      - feat-readarr
    paths:
      - '.github/workflows/build-pi5-image.yml'
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo to build from (owner/name). Leave blank for jabloink/seerr.'
        required: false
        default: ''
      source_ref:
        description: 'Branch/tag/SHA to build. Leave blank for feat-readarr.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pi5-image-${{ github.ref }}-${{ github.event.inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Native arm64 runner (free for public repos): no QEMU emulation, much faster.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Resolve build source and tags
        id: resolve
        run: |
          SOURCE_REPO="${{ github.event.inputs.source_repo }}"
          SOURCE_REF="${{ github.event.inputs.source_ref }}"
          IS_BRIDGE="false"

          if [ -n "$SOURCE_REPO" ] || [ -n "$SOURCE_REF" ]; then
            IS_BRIDGE="true"
          fi

          SOURCE_REPO="${SOURCE_REPO:-jabloink/seerr}"
          SOURCE_REF="${SOURCE_REF:-feat-readarr}"

          # GHCR requires lowercase repository paths; github.repository preserves
          # the actual account casing (e.g. "Luca-Bachini-Barr"), which buildx
          # rejects outright ("repository name must be lowercase").
          IMAGE_REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Docker tags can't contain '/'; a cross-repo bridge tag is prefixed
          # with the source repo's owner so e.g. jabloink/seerr@v3.2.0 doesn't
          # collide with a same-named ref in this repo.
          SAFE_REF=$(echo "$SOURCE_REF" | tr '/' '-')
          if [ "$IS_BRIDGE" = "true" ]; then
            OWNER=$(echo "$SOURCE_REPO" | cut -d/ -f1)
            VERSION_TAG="pi5-bridge-${OWNER}-${SAFE_REF}"
          else
            # Pin the exact upstream commit so every build is traceable and
            # can be redeployed later (pi5-feat-readarr-<sha7>).
            SHA=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/$SOURCE_REPO/commits/$SOURCE_REF" | jq -r .sha)
            SOURCE_REF="$SHA"
            VERSION_TAG="pi5-${SAFE_REF}-${SHA:0:7}"
          fi

          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "is_bridge=$IS_BRIDGE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "image_repo_lower=$IMAGE_REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.source_repo }}
          ref: ${{ steps.resolve.outputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.resolve.outputs.image_repo_lower }}:${{ steps.resolve.outputs.version_tag }}
            ${{ steps.resolve.outputs.is_bridge == 'false' && format('ghcr.io/{0}:pi5-latest', steps.resolve.outputs.image_repo_lower) || '' }}
          build-args: |
            COMMIT_TAG=${{ steps.resolve.outputs.source_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Posts a build result card to Discord #github. Uses the DISCORD_WEBHOOK_URL
      # repo secret; if it isn't set, this step skips so builds never fail on it.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          IMAGE: ghcr.io/${{ steps.resolve.outputs.image_repo_lower }}
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
          IS_BRIDGE: ${{ steps.resolve.outputs.is_bridge }}
          SOURCE: ${{ steps.resolve.outputs.source_repo }}@${{ steps.resolve.outputs.source_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          COMMIT="$(git log -1 --format='%h %s' 2>/dev/null | cut -c1-200)"
          TAGS="\`$IMAGE:$VERSION_TAG\`"
          [ "$IS_BRIDGE" = "false" ] && TAGS="$TAGS"$'\n'"\`$IMAGE:pi5-latest\`"
          case "$JOB_STATUS" in
            success)   TITLE="✅ seerr-chaptarr: Pi 5 image built"; COLOR=3066993 ;;
            cancelled) TITLE="⚪ seerr-chaptarr: build cancelled";   COLOR=9807270 ;;
            *)         TITLE="❌ seerr-chaptarr: Pi 5 build FAILED";  COLOR=15158332 ;;
          esac
          jq -n --arg t "$TITLE" --argjson c "$COLOR" --arg url "$RUN_URL" --arg tags "$TAGS" \
                --arg commit "${COMMIT:-n/a}" --arg src "$SOURCE" --arg ev "$EVENT" --arg d "${DIGEST:-n/a}" '{
            username: "GitHub Builds",
            avatar_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/github.png",
            embeds: [{ title: $t, url: $url, color: $c,
              fields: [
                {name: "Image", value: $tags},
                {name: "Commit", value: $commit},
                {name: "Source", value: $src, inline: true},
                {name: "Trigger", value: $ev, inline: true},
                {name: "Digest", value: ("`" + ($d[0:19]) + "…`"), inline: true}
              ],
              footer: {text: "Not deployed. Back up the seerr_fork DB, then update the service (manual; Gantry skips it)."} }]
          }' | curl -sS -m 20 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
